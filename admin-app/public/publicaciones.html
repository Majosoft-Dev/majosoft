<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicaciones · Panel Majosoft</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/panel.css" />
  <script type="module" src="/admin/menu.js" blocking="render"></script>
  <!-- Publicaciones programadas de UMME y Cursos Umme (10/11/2026): lo que el publicador (/var/www/publicar-umme) va a sacar
       en Instagram y Facebook, lo que ya ha salido y lo que ha fallado. Se recarga sola cada minuto. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; }
    main { max-width: 1180px; padding: 34px 32px 60px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 22px; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
    .kpi b { display: block; font-size: 26px; margin-bottom: 2px; }
    .kpi span { color: var(--muted); font-size: 12.5px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 4px; margin-bottom: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 12px; border-bottom: 1px solid #eeede5; font-size: 13px; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .est { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
    .ok { background: #E7F6F0; color: #2E9E6B; } .prog { background: #F1F4F3; color: #555; } .reint { background: #FFF3D6; color: #A86A00; } .mal { background: #FDE8E6; color: #C0392B; }
    .err { color: #C0392B; font-size: 12px; margin-top: 6px; max-width: 300px; overflow-wrap: anywhere; }
    .cuenta { color: var(--muted); font-size: 12px; }
    .hoy td { background: #FFFBEA; }
    .pasado td:first-child { color: var(--muted); }
    pre { background: var(--ink); color: var(--cream); padding: 12px 14px; border-radius: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin: 8px 4px; }
    .vistas { display: inline-flex; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
    .vistas button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted); }
    .vistas button.on { background: var(--ink); color: #fff; }
    .mes { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .mes h2 { font-size: 16px; margin: 2px 4px 12px; }
    .rej { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .rej .dn { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
    .dia { min-height: 92px; border: 1px solid #eeede5; border-radius: 10px; padding: 6px; background: #FCFCFA; }
    .dia.fuera { background: transparent; border-color: transparent; }
    .dia.hoy { border-color: #E8C547; background: #FFFBEA; }
    .dia .n { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .pz { display: block; font-size: 11.5px; line-height: 1.3; border-radius: 7px; padding: 4px 6px; margin-bottom: 4px; text-decoration: none; color: #111; border-left: 4px solid; }
    .pz.cu { background: #E4F5EF; border-color: #5FBFA5; } .pz.umme { background: #FBE7EE; border-color: #CF5F7C; }
    .pz.hecho { opacity: .7; } .pz.mal { outline: 2px solid #C0392B; }
    .pz .h { font-weight: 800; }
    .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 4px 14px; }
    .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
    @media (max-width: 760px) { main { padding: 22px 16px 40px; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
<main>
  <h1>Publicaciones programadas</h1>
  <p class="sub">Lo que sale solo en Instagram y Facebook (UMME y Cursos Umme). Se comprueba cada 5 minutos y esta página se recarga sola.</p>
  <div class="kpis" id="kpis"></div>
  <div class="vistas"><button id="vCal" class="on">Calendario</button><button id="vLista">Lista</button></div>
  <div id="cal"></div>
  <div class="card" id="lista" hidden><table><thead><tr><th>Cuándo</th><th>Qué</th><th>Instagram</th><th>Facebook</th></tr></thead><tbody id="filas"></tbody></table></div>
  <details><summary>Registro del publicador (últimas líneas)</summary><pre id="registro">…</pre></details>
</main>
<script>
const NOMBRES = { cursosumme: "@cursosumme · Cursos UMME", umme: "@unamaestramuyespecial · Una maestra muy especial" };
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const titulo = id => id.slice(11).replace(/^cu-/, "").replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
const fecha = c => { const d = new Date(c); return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function estado(d) {
  if (!d) return '<span class="cuenta">—</span>';
  if (d.hecho) return `<a class="est ok" href="${esc(d.enlace)}" target="_blank" rel="noopener">✓ Publicado ↗</a>`;
  if (d.intentos >= 3) return `<span class="est mal">✕ Falló</span><div class="err">${esc(d.error)}</div>`;
  if (d.error) return `<span class="est reint">↻ Reintentando (${d.intentos}/3)</span><div class="err">${esc(d.error)}</div>`;
  return '<span class="est prog">◷ Programado</span>';
}
async function cargar() {
  const r = await fetch("/admin/api/publicador", { credentials: "same-origin" });
  if (!r.ok) return;
  const { cola, registro } = await r.json();
  cola.sort((a, b) => a.cuando.localeCompare(b.cuando));
  const plats = cola.flatMap(p => [p.ig, p.fb].filter(Boolean));
  const hechas = plats.filter(d => d.hecho).length, fallos = plats.filter(d => !d.hecho && d.intentos >= 3).length;
  const prox = cola.find(p => [p.ig, p.fb].some(d => d && !d.hecho));
  const hoy = new Date().toDateString();
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><b>${cola.length}</b><span>piezas en la cola</span></div>` +
    `<div class="kpi"><b>${hechas} / ${plats.length}</b><span>publicadas (IG + FB)</span></div>` +
    `<div class="kpi"><b style="color:${fallos ? "#C0392B" : "#2E9E6B"}">${fallos}</b><span>fallos</span></div>` +
    `<div class="kpi"><b style="font-size:16px">${prox ? esc(fecha(prox.cuando)) : "—"}</b><span>${prox ? esc(titulo(prox.id)) : "nada pendiente"}</span></div>`;
  document.getElementById("filas").innerHTML = cola.map(p => {
    const d = new Date(p.cuando), cls = d.toDateString() === hoy ? "hoy" : d < new Date() ? "pasado" : "";
    return `<tr class="${cls}"><td style="white-space:nowrap">${esc(fecha(p.cuando))}</td><td><b>${esc(titulo(p.id))}</b><div class="cuenta">${esc(NOMBRES[p.cuenta] || p.cuenta)} · ${esc(p.tipo)}</div></td><td>${estado(p.ig)}</td><td>${estado(p.fb)}</td></tr>`;
  }).join("") || '<tr><td colspan="4" class="cuenta">No hay nada programado.</td></tr>';
  document.getElementById("registro").textContent = registro || "(vacío)";
  pintarCalendario(cola);
}
// el calendario: del mes actual al del último programado; cada pieza en su día con su hora, su cuenta y su estado
const ICO = { reel: "🎬", carrusel: "🖼️", historia: "◔" };
function marca(p) {
  const ds = [p.ig, p.fb].filter(Boolean);
  if (ds.length && ds.every(d => d.hecho)) return "✓";
  if (ds.some(d => !d.hecho && d.intentos >= 3)) return "✕";
  if (ds.some(d => d.error)) return "↻";
  return "";
}
function pintarCalendario(cola) {
  const hoy = new Date(), porDia = {};
  for (const p of cola) { const k = p.cuando.slice(0, 10); (porDia[k] ||= []).push(p); }
  const ultimo = cola.length ? new Date(cola[cola.length - 1].cuando) : hoy;
  let html = '<div class="leyenda"><span><i style="background:#5FBFA5"></i>Cursos Umme</span><span><i style="background:#CF5F7C"></i>Una maestra muy especial</span><span>🎬 reel · 🖼️ carrusel · ◔ historia</span><span>✓ publicado · ↻ reintentando · ✕ falló</span></div>';
  for (let m = new Date(hoy.getFullYear(), hoy.getMonth(), 1); m <= ultimo; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    html += `<div class="mes"><h2>${m.toLocaleDateString("es-ES", { month: "long", year: "numeric" }).replace(/^./, c => c.toUpperCase())}</h2><div class="rej">` + ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(d => `<div class="dn">${d}</div>`).join("");
    const pad = (m.getDay() + 6) % 7;
    for (let i = 0; i < pad; i++) html += '<div class="dia fuera"></div>';
    const dias = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= dias; d++) {
      const f = new Date(m.getFullYear(), m.getMonth(), d), k = `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const ps = porDia[k] || [];
      html += `<div class="dia${f.toDateString() === hoy.toDateString() ? " hoy" : ""}"><div class="n">${d}</div>` + ps.map(p => {
        const mk = marca(p), enl = (p.ig && p.ig.enlace) || (p.fb && p.fb.enlace);
        const tag = enl ? "a" : "div";
        return `<${tag} class="pz ${p.cuenta === "cursosumme" ? "cu" : "umme"}${mk === "✓" ? " hecho" : ""}${mk === "✕" ? " mal" : ""}"${enl ? ` href="${esc(enl)}" target="_blank" rel="noopener"` : ""} title="${esc(titulo(p.id))} · ${esc(NOMBRES[p.cuenta] || p.cuenta)}"><span class="h">${p.cuando.slice(11, 16)}</span> ${ICO[p.tipo] || ""} ${esc(titulo(p.id).slice(0, 34))} ${mk}</${tag}>`;
      }).join("") + "</div>";
    }
    html += "</div></div>";
  }
  document.getElementById("cal").innerHTML = html;
}
const vista = v => { document.getElementById("cal").hidden = v !== "cal"; document.getElementById("lista").hidden = v !== "lista"; vCal.classList.toggle("on", v === "cal"); vLista.classList.toggle("on", v === "lista"); try { localStorage.setItem("mj-pub-vista", v); } catch {} };
vCal.onclick = () => vista("cal"); vLista.onclick = () => vista("lista");
try { if (localStorage.getItem("mj-pub-vista") === "lista") vista("lista"); } catch {}
cargar();
setInterval(cargar, 60e3);
</script>
</body>
</html>
