<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tareas · Panel Majosoft</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/panel.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; }
    main { max-width: 1180px; padding: 34px 32px 60px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn:hover { border-color: var(--ink); }
    .btn--ink { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .btn--danger:hover { border-color: var(--bad); color: var(--bad); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .col-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .col-head .av { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--cream); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .col-head h2 { font-size: 16px; margin: 0; flex: 1; }
    .col-head small { color: var(--muted); font-weight: 600; }
    .grp { padding: 4px 0 8px; border-bottom: 1px solid #eeede5; }
    .grp:last-child { border-bottom: 0; }
    .grp h3, .grp summary { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0; padding: 12px 16px 6px; font-weight: 700; cursor: default; }
    .grp summary { cursor: pointer; }
    .t { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 16px; cursor: pointer; }
    .t:hover { background: #fafaf5; }
    .t input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--ink); cursor: pointer; }
    .t b { display: block; font-weight: 600; }
    .t small { display: block; color: var(--muted); margin-top: 2px; white-space: pre-line; }
    .t.hecha b { text-decoration: line-through; color: var(--muted); }
    .t.renov { cursor: default; }
    .t.renov .ic { font-size: 14px; line-height: 18px; text-align: center; }
    .t.renov a { color: inherit; }
    .tag { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--cream); white-space: nowrap; }
    .tag.curso { background: #f3f4dc; }
    .tag.tarde { background: #fde7e5; color: var(--bad); }
    .tag.hoy { background: #fff1d6; color: var(--warn); }
    .empty { padding: 10px 16px 14px; color: var(--muted); font-size: 13px; }
    .cal { padding: 16px 18px; margin-bottom: 14px; }
    .cal h2 { font-size: 15px; margin: 0 0 4px; }
    .cal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .cal .url { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #f3f4dc; border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
    .cal .url b { width: 70px; font-size: 12.5px; }
    .cal .url code { flex: 1; min-width: 200px; font-size: 12px; word-break: break-all; }
    .cal ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(21,22,26,.4); }
    dialog form { padding: 22px 24px; display: grid; gap: 12px; }
    dialog h2 { margin: 0; font-size: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted); }
    label.f input, label.f textarea, label.f select { font: inherit; font-size: 14px; color: var(--ink); padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #fcfcf8; font-weight: 500; }
    label.f textarea { min-height: 80px; resize: vertical; }
    .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .acts .btn--danger { margin-right: auto; }
    .vista { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
    .vista button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .vista button.on { background: var(--ink); color: var(--cream); }
    .mes-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .mes-head h2 { font-size: 16px; margin: 0 auto 0 0; text-transform: capitalize; }
    .leyenda { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 8px; }
    .leyenda i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
    .mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .mes .dsem { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 8px; border-bottom: 1px solid var(--line); }
    .dia { min-height: 104px; border-right: 1px solid #eeede5; border-bottom: 1px solid #eeede5; padding: 6px; cursor: pointer; }
    .dia:nth-child(7n) { border-right: 0; }
    .dia:hover { background: #fafaf5; }
    .dia.fuera { background: #fbfbf7; color: #b3b2a8; }
    .dia .n { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .dia.hoy .n { background: var(--ink); color: var(--cream); border-radius: 99px; display: inline-block; padding: 1px 7px; }
    .ev { display: block; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--cream); }
    .ev.jose, .leyenda .jose { background: #dde9fb; }
    .ev.maria, .leyenda .maria { background: #f3f4dc; }
    .ev.renov, .leyenda .renov { background: #fff1d6; }
    .ev.hecha { text-decoration: line-through; opacity: .55; }
    .renovs { margin-top: 14px; }
    .renovs .mes-head h2 { text-transform: none; }
    .renovs table { width: 100%; border-collapse: collapse; }
    .renovs td, .renovs th { padding: 10px 16px; text-align: left; border-bottom: 1px solid #eeede5; vertical-align: top; }
    .renovs th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .renovs tbody tr { cursor: pointer; }
    .renovs tbody tr:hover { background: #fafaf5; }
    .renovs td small { display: block; color: var(--muted); }
    @media (max-width: 900px) { .dia { min-height: 70px; } .ev { font-size: 10px; } .renovs .opc { display: none; } }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } main { padding: 24px 16px 40px; } }
  </style>
</head>
<body>
  <main>
    <div class="page-head">
      <div><div class="crumbs">General</div><h1>Tareas</h1><p>Lo que tenemos pendiente y en curso, repartido entre Jose y María, con las renovaciones de los clientes.</p></div>
      <div class="tools"><button class="btn" id="bCal">📅 Google Calendar</button><button class="btn btn--ink" id="bNew">+ Nueva tarea</button></div>
    </div>
    <div class="card cal" id="cal" hidden></div>
    <div class="vista"><button data-v="tablero" class="on">Tablero</button><button data-v="calendario">Calendario</button></div>
    <div class="cols" id="cols"></div>
    <div class="card" id="mes" hidden></div>
    <div class="card renovs" id="renovs"></div>
  </main>
  <dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<script type="module">
import { mountShell, api, toast } from "/admin/panel.js";
const me = await mountShell("tareas");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoy = () => iso(new Date());
const fecha = s => new Date(s + "T12:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
const token = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(24)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const PERSONAS = { jose: "Jose", maria: "María" };
const ESTADOS = { pendiente: "Pendiente", curso: "En curso", hecha: "Hecha" };
const yo = /jos[eé]/i.test(`${me?.name} ${me?.email}`) ? "jose" : "maria"; // persona por defecto de las tareas nuevas

let tareas = await api("docs/tareas");
let fichas = await api("docs/renovaciones");
const presupuestos = await api("docs/presupuestos");
let ajustes = (await api("docs/ajustes")).find(a => a.id === "calendario") || { id: "calendario" };
const put = t => api(`docs/tareas/${t.id}`, { method: "PUT", body: t });
const PERIODOS = { mensual: ["Mensual", 1], trimestral: ["Trimestral", 3], semestral: ["Semestral", 6], anual: ["Anual", 12] };
const FECHA = /^\d{4}-\d{2}-\d{2}$/;

// Todo lo que se renueva: fichas propias y presupuestos con renovación
const fuentes = () => [
  ...fichas.map(r => ({ ...r, titulo: [r.cliente, r.concepto].filter(Boolean).join(" · ") || "Renovación", ficha: r })),
  ...presupuestos.filter(p => PERIODOS[p.renov?.tipo]).map(p => ({ ...p.renov, titulo: p.cliente || p.titulo, presupuesto: p })),
].filter(r => PERIODOS[r.tipo] && FECHA.test(r.inicio || ""));
// Misma cuenta que el servidor: inicio + n periodos, ajustando al último día de los meses cortos
const sumar = (f, tipo, n) => { const [y, m, d] = f.split("-").map(Number), k = PERIODOS[tipo][1] * n; return iso(new Date(y, m - 1 + k, Math.min(d, new Date(y, m + k, 0).getDate()))); };
function ocurrencias(r, desde, hasta) {
  const out = [];
  for (let n = 1; n < 2000; n++) {
    const f = sumar(r.inicio, r.tipo, n);
    if (f > hasta || (r.hasta && f > r.hasta)) break;
    if (f >= desde) out.push(f);
  }
  return out;
}
const siguiente = r => ocurrencias(r, hoy(), "9999-12-31")[0] || "";
function proximas(dias = 60) {
  const tope = iso(new Date(Date.now() + dias * 864e5));
  return fuentes().map(r => ({ r, fecha: siguiente(r) })).filter(x => x.fecha && x.fecha <= tope).sort((a, b) => a.fecha.localeCompare(b.fecha));
}

const etiquetaFecha = (f, hecha) => {
  if (!f) return "";
  const cls = hecha ? "" : f < hoy() ? "tarde" : f === hoy() ? "hoy" : "";
  return `<span class="tag ${cls}">${f === hoy() ? "Hoy" : fecha(f)}</span>`;
};
const fila = t => `<div class="t ${t.estado === "hecha" ? "hecha" : ""}" data-id="${t.id}">
  <input type="checkbox" data-done="${t.id}" ${t.estado === "hecha" ? "checked" : ""} title="Marcar como hecha" />
  <div><b>${esc(t.titulo)}</b>${t.detalle ? `<small>${esc(t.detalle)}</small>` : ""}</div>
  <div>${etiquetaFecha(t.fecha, t.estado === "hecha")}</div></div>`;
const orden = (a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999") || (b.creada || 0) - (a.creada || 0);

function pintar() {
  const renov = proximas();
  $("cols").innerHTML = Object.entries(PERSONAS).map(([k, nombre]) => {
    const mias = tareas.filter(t => (t.persona || "maria") === k);
    const de = e => mias.filter(t => (t.estado || "pendiente") === e).sort(orden);
    const hechas = de("hecha").sort((a, b) => (b.hechaEn || 0) - (a.hechaEn || 0));
    const rs = renov.filter(x => x.r.persona === k || !x.r.persona);
    const grp = (titulo, lista, vacio) => `<div class="grp"><h3>${titulo} · ${lista.length}</h3>${lista.length ? lista.map(fila).join("") : `<div class="empty">${vacio}</div>`}</div>`;
    return `<div class="card">
      <div class="col-head"><div class="av">${nombre[0]}</div><h2>${nombre}</h2><small>${de("curso").length + de("pendiente").length} abiertas</small></div>
      ${grp("En curso", de("curso"), "Nada en curso.")}
      ${grp("Pendientes", de("pendiente"), "Sin tareas pendientes.")}
      ${rs.length ? `<div class="grp"><h3>Renovaciones próximas · ${rs.length}</h3>${rs.map(x => `<div class="t renov"><span class="ic">🔁</span>
        <div><b>${x.r.persona ? "" : "(sin asignar) "}Renovar ${x.r.tipo}: ${esc(x.r.titulo)}</b>${x.r.importe || x.r.nota ? `<small>${esc([x.r.importe, x.r.nota].filter(Boolean).join(" · "))}</small>` : ""}</div>
        <div>${etiquetaFecha(x.fecha)}</div></div>`).join("")}</div>` : ""}
      ${hechas.length ? `<details class="grp"><summary>Hechas · ${hechas.length}</summary>${hechas.slice(0, 30).map(fila).join("")}</details>` : ""}
    </div>`;
  }).join("");
  pintarMes(); pintarRenovs();
}

/* ===== Calendario del mes ===== */
let mesVisto = new Date(); mesVisto.setDate(1);
function pintarMes() {
  const y = mesVisto.getFullYear(), m = mesVisto.getMonth();
  const ini = new Date(y, m, 1 - (new Date(y, m, 1).getDay() + 6) % 7); // lunes de la primera semana
  const dias = Array.from({ length: 42 }, (_, i) => new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i));
  const desde = iso(dias[0]), hasta = iso(dias[41]), por = {};
  const add = (f, html) => (por[f] ||= []).push(html);
  for (const t of tareas) if (t.fecha >= desde && t.fecha <= hasta)
    add(t.fecha, `<span class="ev ${t.persona} ${t.estado === "hecha" ? "hecha" : ""}" data-id="${t.id}" title="${esc(PERSONAS[t.persona] + ": " + t.titulo)}">${esc(t.titulo)}</span>`);
  for (const r of fuentes()) for (const f of ocurrencias(r, desde, hasta))
    add(f, `<span class="ev renov" ${r.ficha ? `data-ren="${r.ficha.id}"` : `data-pre="${r.presupuesto.id}"`} title="${esc("Renovar " + r.tipo + ": " + r.titulo)}">🔁 ${esc(r.titulo)}</span>`);
  $("mes").innerHTML = `<div class="mes-head"><h2>${mesVisto.toLocaleDateString("es-ES", { month: "long", year: "numeric" })}</h2>
      <div class="leyenda"><span><i class="jose"></i>Jose</span><span><i class="maria"></i>María</span><span><i class="renov"></i>Renovación</span></div>
      <button class="btn" data-mes="-1">‹</button><button class="btn" data-mes="0">Hoy</button><button class="btn" data-mes="1">›</button></div>
    <div class="mes">${["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(d => `<div class="dsem">${d}</div>`).join("")}
    ${dias.map(d => { const f = iso(d); return `<div class="dia ${d.getMonth() !== m ? "fuera" : ""} ${f === hoy() ? "hoy" : ""}" data-dia="${f}"><div class="n">${d.getDate()}</div>${(por[f] || []).join("")}</div>`; }).join("")}</div>`;
}
$("mes").addEventListener("click", e => {
  const b = e.target.closest("[data-mes]");
  if (b) { const k = +b.dataset.mes; mesVisto = k ? new Date(mesVisto.getFullYear(), mesVisto.getMonth() + k, 1) : (d => (d.setDate(1), d))(new Date()); return pintarMes(); }
  const ev = e.target.closest(".ev");
  if (ev?.dataset.id) return editar(tareas.find(t => t.id === ev.dataset.id));
  if (ev?.dataset.ren) return editarRenov(fichas.find(r => r.id === ev.dataset.ren));
  if (ev?.dataset.pre) return location.href = "/admin/presupuestos?id=" + encodeURIComponent(ev.dataset.pre);
  const dia = e.target.closest("[data-dia]");
  if (dia) editar(null, dia.dataset.dia);
});
document.querySelector(".vista").addEventListener("click", e => {
  const v = e.target.dataset.v; if (!v) return;
  document.querySelectorAll(".vista button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("cols").hidden = v !== "tablero"; $("mes").hidden = v !== "calendario";
});

/* ===== Renovaciones de clientes ===== */
function pintarRenovs() {
  const lista = fuentes().map(r => ({ r, prox: siguiente(r) })).sort((a, b) => (a.prox || "9999").localeCompare(b.prox || "9999"));
  $("renovs").innerHTML = `<div class="mes-head"><h2>Renovaciones de clientes · ${lista.length}</h2><button class="btn btn--ink" id="bNewRen">+ Nueva renovación</button></div>
    ${lista.length ? `<table><thead><tr><th>Cliente y servicio</th><th>Periodicidad</th><th>Próxima</th><th class="opc">Importe</th><th class="opc">Responsable</th></tr></thead><tbody>
    ${lista.map(({ r, prox }) => `<tr ${r.ficha ? `data-ren="${r.ficha.id}"` : `data-pre="${r.presupuesto.id}"`}>
      <td><b>${esc(r.titulo)}</b>${r.nota ? `<small>${esc(r.nota)}</small>` : ""}${r.presupuesto ? "<small>Desde el presupuesto</small>" : ""}</td>
      <td>${PERIODOS[r.tipo][0]}</td><td>${prox ? etiquetaFecha(prox) : "Terminada"}</td>
      <td class="opc">${esc(r.importe || "")}</td><td class="opc">${PERSONAS[r.persona] || "Sin asignar"}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Todavía no hay renovaciones.</div>`}`;
}
$("renovs").addEventListener("click", e => {
  if (e.target.id === "bNewRen") return editarRenov();
  const tr = e.target.closest("tr");
  if (tr?.dataset.ren) editarRenov(fichas.find(r => r.id === tr.dataset.ren));
  if (tr?.dataset.pre) location.href = "/admin/presupuestos?id=" + encodeURIComponent(tr.dataset.pre);
});
const opts = (obj, v) => Object.entries(obj).map(([k, l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${Array.isArray(l) ? l[0] : l}</option>`).join("");
function editarRenov(r) {
  const nueva = !r;
  r ??= { id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), cliente: "", concepto: "", tipo: "mensual", inicio: hoy(), hasta: "", importe: "", persona: "", nota: "" };
  $("frm").innerHTML = `<h2>${nueva ? "Nueva renovación" : "Editar renovación"}</h2>
    <div class="row"><label class="f">Cliente<input name="cliente" required value="${esc(r.cliente)}" /></label>
      <label class="f">Servicio<input name="concepto" value="${esc(r.concepto)}" placeholder="Mantenimiento, dominio, licencia…" /></label></div>
    <div class="row"><label class="f">Periodicidad<select name="tipo">${opts(PERIODOS, r.tipo)}</select></label>
      <label class="f">Importe (opcional)<input name="importe" value="${esc(r.importe)}" placeholder="75 €/mes" /></label></div>
    <div class="row"><label class="f">Inicio del periodo actual o del servicio<input type="date" name="inicio" required value="${esc(r.inicio)}" /></label>
      <label class="f">Hasta (opcional)<input type="date" name="hasta" value="${esc(r.hasta)}" /></label></div>
    <label class="f">Responsable<select name="persona"><option value="">Sin asignar</option>${opts(PERSONAS, r.persona)}</select></label>
    <label class="f">Nota (opcional)<textarea name="nota">${esc(r.nota)}</textarea></label>
    <div class="acts">${nueva ? "" : `<button type="button" class="btn btn--danger" id="bDel">Eliminar</button>`}
      <button type="button" class="btn" id="bCancel">Cancelar</button><button class="btn btn--ink" value="ok">${nueva ? "Crear" : "Guardar"}</button></div>`;
  $("bCancel").onclick = () => $("dlg").close();
  if (!nueva) $("bDel").onclick = async () => {
    if (!confirm("¿Eliminar esta renovación?")) return;
    await api(`docs/renovaciones/${r.id}`, { method: "DELETE" });
    fichas = fichas.filter(x => x.id !== r.id); $("dlg").close(); pintar();
  };
  $("frm").onsubmit = async () => {
    const f = Object.fromEntries(new FormData($("frm")));
    Object.assign(r, { cliente: f.cliente.trim(), concepto: f.concepto.trim(), tipo: f.tipo, inicio: f.inicio, hasta: f.hasta, importe: f.importe.trim(), persona: f.persona, nota: f.nota.trim() });
    try { await api(`docs/renovaciones/${r.id}`, { method: "PUT", body: r }); } catch (e) { return toast(e.message, true); }
    if (nueva) fichas.push(r);
    pintar(); toast(nueva ? "Renovación creada" : "Guardado");
  };
  $("dlg").showModal();
}

function editar(t, dia = "") {
  const nueva = !t;
  t ??= { id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), titulo: "", detalle: "", persona: yo, estado: "pendiente", fecha: dia, creada: Date.now() };
  $("frm").innerHTML = `<h2>${nueva ? "Nueva tarea" : "Editar tarea"}</h2>
    <label class="f">Tarea<input name="titulo" required value="${esc(t.titulo)}" placeholder="Qué hay que hacer" /></label>
    <label class="f">Detalle (opcional)<textarea name="detalle">${esc(t.detalle)}</textarea></label>
    <div class="row"><label class="f">Persona<select name="persona">${opts(PERSONAS, t.persona)}</select></label>
      <label class="f">Estado<select name="estado">${opts(ESTADOS, t.estado)}</select></label></div>
    <label class="f">Fecha (opcional, sale en el calendario)<input type="date" name="fecha" value="${esc(t.fecha)}" /></label>
    <div class="acts">${nueva ? "" : `<button type="button" class="btn btn--danger" id="bDel">Eliminar</button>`}
      <button type="button" class="btn" id="bCancel">Cancelar</button><button class="btn btn--ink" value="ok">${nueva ? "Crear" : "Guardar"}</button></div>`;
  $("bCancel").onclick = () => $("dlg").close();
  if (!nueva) $("bDel").onclick = async () => {
    if (!confirm("¿Eliminar esta tarea?")) return;
    await api(`docs/tareas/${t.id}`, { method: "DELETE" });
    tareas = tareas.filter(x => x.id !== t.id); $("dlg").close(); pintar();
  };
  $("frm").onsubmit = async () => {
    const f = Object.fromEntries(new FormData($("frm")));
    if (f.estado === "hecha" && t.estado !== "hecha") t.hechaEn = Date.now();
    Object.assign(t, { titulo: f.titulo.trim(), detalle: f.detalle.trim(), persona: f.persona, estado: f.estado, fecha: f.fecha });
    try { await put(t); } catch (e) { return toast(e.message, true); }
    if (nueva) tareas.push(t);
    pintar(); toast(nueva ? "Tarea creada" : "Guardado");
  };
  $("dlg").showModal();
  $("frm").titulo.focus();
}

$("bNew").onclick = () => editar(null);
$("cols").addEventListener("click", async e => {
  const done = e.target.dataset.done;
  if (done) {
    const t = tareas.find(x => x.id === done);
    t.estado = e.target.checked ? "hecha" : "pendiente";
    t.hechaEn = e.target.checked ? Date.now() : undefined;
    try { await put(t); } catch (err) { toast(err.message, true); }
    return pintar();
  }
  const fila = e.target.closest(".t[data-id]");
  if (fila) editar(tareas.find(x => x.id === fila.dataset.id));
});

/* ===== Conexión con Google Calendar (suscripción iCal) ===== */
const url = p => `${location.origin}/admin/calendario/${ajustes.token}.ics${p ? "?persona=" + p : ""}`;
function pintarCal() {
  $("cal").innerHTML = `<h2>Conectar con Google Calendar</h2>
    <p>Google Calendar se suscribe a un enlace privado y muestra las tareas con fecha y las renovaciones. Las actualizaciones pueden tardar unas horas en aparecer en Google.</p>
    ${ajustes.token ? [["", "Todo"], ["jose", "Jose"], ["maria", "María"]].map(([k, l]) => `<div class="url"><b>${l}</b><code>${esc(url(k))}</code><button class="btn" data-copy="${k}">Copiar</button></div>`).join("") + `
    <ol><li>En Google Calendar (en el ordenador), junto a «Otros calendarios», pulsa <b>+</b> y luego <b>Desde URL</b>.</li>
      <li>Pega el enlace (el de «Todo» o solo el tuyo) y pulsa <b>Añadir calendario</b>.</li>
      <li>No compartáis el enlace: quien lo tenga ve las tareas.</li></ol>
    <p style="margin:12px 0 0"><button class="btn btn--danger" id="bTok">Cambiar enlace</button></p>`
    : `<button class="btn btn--ink" id="bTok">Crear enlace del calendario</button>`}`;
}
$("bCal").onclick = () => { $("cal").hidden = !$("cal").hidden; pintarCal(); };
$("cal").addEventListener("click", async e => {
  if (e.target.dataset.copy != null) { await navigator.clipboard.writeText(url(e.target.dataset.copy)); return toast("Enlace copiado"); }
  if (e.target.id === "bTok") {
    if (ajustes.token && !confirm("El enlace anterior dejará de funcionar y habrá que volver a añadirlo en Google Calendar. ¿Continuar?")) return;
    ajustes.token = token();
    try { await api("docs/ajustes/calendario", { method: "PUT", body: ajustes }); } catch (err) { return toast(err.message, true); }
    pintarCal(); toast("Enlace listo");
  }
});

pintar();
</script>
</body>
</html>
