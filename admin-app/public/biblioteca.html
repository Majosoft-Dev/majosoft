<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca de UI · Panel Majosoft</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/panel.css" />
  <script type="module" src="/admin/menu.js" blocking="render"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; }
    main { max-width: 1400px; padding: 34px 32px 60px; }
    .page-head { align-items: center; }

    /* Buscador grande */
    .buscar { position: relative; width: min(100%, 400px); }
    .buscar svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
    .buscar input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 44px 12px 40px; font: inherit; font-size: 14.5px; color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
    .buscar input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(21,22,26,.06); }
    .buscar kbd { position: absolute; right: 12px; top: 50%; translate: 0 -50%; font: 600 11px "JetBrains Mono", monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--cream); }
    .buscar input:focus + kbd, .buscar input:not(:placeholder-shown) + kbd { display: none; }

    /* Estructura: índice a la izquierda, contenido a la derecha */
    .bib { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 36px; align-items: start; }
    .indice { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-bottom: 20px; scrollbar-width: thin; }
    .indice .fam { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 16px 10px 4px; }
    .indice a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 13.5px; transition: background .15s, color .15s; }
    .indice a small { color: var(--muted); font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .indice a:hover { background: #fff; color: var(--ink); }
    .indice a.on { background: var(--ink); color: var(--cream); }
    .indice a.on small { color: var(--lime); }
    .indice a.vacio-g { opacity: .4; }
    .indice .todas { font-weight: 800; color: var(--ink); }
    .indice .pro-sel { margin: 6px 0 4px; }
    .indice .pro-sel label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 10px 6px; }
    .indice select { width: 100%; }

    /* Cabecera de cada vista */
    .vista-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .vista-head .miga { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .vista-head .miga a { color: inherit; text-decoration: none; }
    .vista-head .miga a:hover { color: var(--ink); }
    .vista-head h2 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .vista-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .filtro-on { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 6px 6px 12px; font-size: 12.5px; font-weight: 700; }
    .filtro-on i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .filtro-on button { border: 0; background: var(--cream); border-radius: 99px; width: 22px; height: 22px; cursor: pointer; color: var(--muted); font-size: 12px; }
    .filtro-on button:hover { background: var(--ink); color: var(--cream); }

    /* Portada: losas por grupo */
    .familia { margin-bottom: 34px; }
    .familia h3 { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .losas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .losa { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit; }
    .losa .mini { height: 150px; }
    .losa .txt { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .losa b { font-size: 15.5px; letter-spacing: -.015em; }
    .losa p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; flex: 1; }
    .losa .pie { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink2); }
    .puntos { display: flex; }
    .puntos i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid #fff; margin-left: -4px; }

    /* Tarjetas de pieza */
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
    .pieza { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; display: flex; flex-direction: column; text-decoration: none; }
    .pieza .mini { height: 200px; }
    .pieza .txt { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 8px; }
    .pieza b { font-size: 14px; letter-spacing: -.01em; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pro { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink2); }
    .pro i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
    .stack { font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .stack::before { content: "·"; margin-right: 6px; }

    .losa, .pieza { transition: border-color .2s, box-shadow .25s, transform .25s cubic-bezier(.16, 1, .3, 1); }
    .losa:hover, .pieza:hover { border-color: #bdbcb0; box-shadow: 0 14px 34px rgba(21,22,26,.09); transform: translateY(-3px); }
    .losa:focus-visible, .pieza:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* Miniatura viva: la pieza a escala, centrada si es baja */
    .mini { position: relative; overflow: hidden; background: #fff; border-bottom: 1px solid var(--line); }
    .mini iframe { position: absolute; top: 0; left: 0; width: 182%; height: 182%; border: 0; transform: translateY(var(--y, 0px)) scale(.55); transform-origin: 0 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
    .mini iframe.listo { opacity: 1; }
    .mini::after { content: "Abrir"; position: absolute; right: 10px; bottom: 10px; background: var(--ink); color: var(--cream); font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 99px; opacity: 0; translate: 0 4px; transition: opacity .2s, translate .2s; }
    .pieza:hover .mini::after { opacity: 1; translate: 0 0; }
    .losa .mini::after { content: "Ver grupo"; }
    .losa:hover .mini::after { opacity: 1; translate: 0 0; }

    /* Vista directa (controles y movimiento): cada conjunto con sus versiones funcionando a tamaño real */
    .saltos { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 22px; }
    .saltos a { font-size: 12.5px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; text-decoration: none; }
    .saltos a small { color: var(--muted); margin-left: 4px; }
    .saltos a:hover { border-color: var(--ink); }
    .conj { margin-bottom: 34px; scroll-margin-top: 20px; }
    .conj-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .conj-head h3 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .conj-head span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .versiones { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; align-items: start; }
    .versiones.una { grid-template-columns: 1fr; }
    .ver.ancha { grid-column: 1 / -1; }
    .ver { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .ver-vivo { padding: 0; background: #fff; }
    .ver-vivo iframe { display: block; width: 100%; height: 160px; border: 0; opacity: 0; transition: opacity .3s; }
    .ver-vivo iframe.listo { opacity: 1; }
    .ver-pie { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); background: #fcfcf9; }
    .ver-nom { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ver-cod { flex: none; font-size: 12px; font-weight: 700; color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; background: #fff; }
    .ver-cod:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .vacio { text-align: center; color: var(--muted); padding: 60px 20px; background: #fff; border: 1px dashed var(--line); border-radius: 18px; }
    .vacio b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
    .vacio button { margin-top: 12px; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 14px; font: inherit; font-weight: 700; cursor: pointer; }

    /* Detalle a pantalla completa */
    .det { position: fixed; inset: 0; z-index: 60; background: rgba(21,22,26,.45); display: none; padding: 24px; }
    .det.on { display: grid; animation: det-in .2s ease both; }
    .det.on .det-in { animation: det-sube .3s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes det-in { from { opacity: 0; } }
    @keyframes det-sube { from { transform: translateY(14px) scale(.99); opacity: 0; } }
    .det-in { background: var(--cream); border-radius: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.3); max-height: calc(100vh - 48px); }
    .escena { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
    .escena-bar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fff; }
    .tabs { display: flex; gap: 4px; background: var(--cream); border: 1px solid var(--line); padding: 3px; border-radius: 10px; }
    .tabs button { border: none; background: none; padding: 6px 11px; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .tabs button.on { background: var(--ink); color: var(--cream); }
    .escena-bar .sp { flex: 1; }
    .escena-bar .pos { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
    .ico { border: 1px solid var(--line); background: #fff; border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--ink); font-size: 16px; }
    .ico:hover { border-color: var(--ink); }
    .lienzo { flex: 1; overflow: auto; padding: 22px; display: flex; justify-content: center; align-items: flex-start; background-image: radial-gradient(#dcdbd0 1px, transparent 1px); background-size: 16px 16px; }
    .lienzo iframe { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; transition: width .3s cubic-bezier(.16,1,.3,1); min-height: 200px; }
    .ficha { overflow-y: auto; padding: 22px 22px 30px; display: flex; flex-direction: column; gap: 18px; }
    .ficha h3 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .ficha h4 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .ficha p { margin: 0; line-height: 1.55; }
    .ficha ul { margin: 0; padding-left: 18px; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
    .etis { display: flex; flex-wrap: wrap; gap: 6px; }
    .etis a { font-size: 11.5px; font-weight: 700; color: var(--ink2); background: #fff; border: 1px solid var(--line); padding: 4px 9px; border-radius: 99px; text-decoration: none; }
    .etis a:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .usar { background: #f1f2d6; border-radius: 12px; padding: 12px 14px; }
    .usar h4 { color: #6b7000; }
    .arch a { display: block; font: 12px "JetBrains Mono", monospace; color: var(--ink2); text-decoration: none; padding: 6px 8px; border-radius: 7px; background: #fff; border: 1px solid var(--line); margin-bottom: 4px; overflow-wrap: anywhere; }
    .arch a:hover { border-color: var(--ink); }
    .codigo { background: var(--ink); border-radius: 12px; overflow: hidden; }
    .codigo-bar { display: flex; align-items: center; gap: 4px; padding: 6px; border-bottom: 1px solid #2a2b2f; }
    .codigo-bar button { border: none; background: none; color: #a9a99c; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
    .codigo-bar button.on { background: #2a2b2f; color: var(--lime); }
    .codigo-bar button[disabled] { opacity: .35; cursor: default; }
    .codigo-bar .sp { flex: 1; }
    .codigo-bar .copiar { color: var(--cream); border: 1px solid #3a3a33; }
    .codigo-bar .copiar:hover { border-color: var(--lime); }
    .codigo pre { margin: 0; padding: 14px; max-height: 340px; overflow: auto; color: #e8e7dc; font: 12px/1.6 "JetBrains Mono", monospace; white-space: pre; tab-size: 2; }

    @media (max-width: 1100px) {
      .det { padding: 0; }
      .det-in { grid-template-columns: 1fr; max-height: 100vh; border-radius: 0; overflow-y: auto; }
      .escena { border-right: 0; border-bottom: 1px solid var(--line); min-height: 60vh; }
      .ficha { overflow: visible; }
    }
    /* Tablet y móvil: el índice pasa a una fila de pastillas que se desliza */
    @media (max-width: 900px) {
      .bib { grid-template-columns: 1fr; gap: 18px; }
      .indice { position: static; flex-direction: row; overflow-x: auto; max-height: none; gap: 6px; padding: 0 16px 4px; margin: 0 -16px; scrollbar-width: none; }
      .indice .fam, .indice .pro-sel label { display: none; }
      .indice a { flex: none; background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; }
      .indice a.on { border-color: var(--ink); }
      .indice .pro-sel { flex: none; margin: 0; min-width: 170px; }
    }
    @media (max-width: 700px) {
      main { padding: 22px 16px 50px; }
      .rejilla, .losas, .versiones { grid-template-columns: 1fr; }
      .tabs-ancho { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .losa, .pieza, .mini iframe, .det, .det-in { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="page-head">
      <div><div class="crumbs">Diseño</div><h1>Biblioteca de UI</h1><p id="resumen">Todas las piezas de los paneles que hemos construido.</p></div>
      <label class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar una pieza…" aria-label="Buscar una pieza" autocomplete="off" /><kbd>/</kbd></label>
    </div>
    <div class="bib">
      <nav class="indice" id="indice" aria-label="Grupos"></nav>
      <section id="vista"></section>
    </div>
  </main>

  <div class="det" id="det" role="dialog" aria-modal="true" aria-label="Pieza">
    <div class="det-in">
      <div class="escena">
        <div class="escena-bar">
          <div class="tabs tabs-ancho" id="ancho"><button data-w="100%" class="on">Escritorio</button><button data-w="820px">Tablet</button><button data-w="390px">Móvil</button></div>
          <span class="sp"></span>
          <span class="pos" id="pos"></span>
          <button class="ico" id="ant" title="Anterior (←)">‹</button>
          <button class="ico" id="sig" title="Siguiente (→)">›</button>
          <button class="ico" id="cerrar" title="Cerrar (Esc)">✕</button>
        </div>
        <div class="lienzo" id="lienzo"></div>
      </div>
      <div class="ficha" id="ficha"></div>
    </div>
  </div>

<script type="module">
import { mountShell, toast } from "/admin/panel.js";
await mountShell("biblioteca");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

const { proyectos, piezas, grupos } = await fetch("/admin/biblioteca.json", { credentials: "same-origin" }).then(r => r.json());
const GR = Object.fromEntries(grupos.map(g => [g.id, g]));
const PZ = Object.fromEntries(piezas.map(p => [p.id, p]));
const familias = [...new Set(grupos.map(g => g.familia))];
const COLORES = ["#2f7d4f", "#2563c9", "#a86b00", "#b4236e", "#6b4fc9", "#0f8a8a", "#b42318", "#5c6b0c", "#8a5a2b", "#3a3a33", "#c2410c"];
const nombresPro = [...new Set(piezas.map(p => p.proyecto))];
const color = pro => COLORES[nombresPro.indexOf(pro) % COLORES.length];
const fuentes = Object.fromEntries(proyectos.map(p => [p.proyecto, p.tipografia || ""]));
$("resumen").textContent = `${piezas.length} piezas de ${nombresPro.length} proyectos, cada una funcionando, con sus reglas y su código.`;

/* ===== La página de cada pieza (aislada en su iframe) =====
   Avisa de su altura para que el iframe grande se ajuste y las miniaturas bajas se centren. */
const FUENTES = "family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Krona+One&family=Anton&family=Outfit:wght@400;500;600;700;800&family=Just+Another+Hand";
const doc = p => `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?${FUENTES}&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}body{padding:20px;font-family:Inter,system-ui,sans-serif;font-size:14px;color:#15161a;background:#fff}</style>
<style>${p.css}</style></head><body>${p.html}
<script>try{${p.js}\n}catch(e){console.error(e)}<\/script>
<script>const t=()=>parent.postMessage({bibAlto:Math.ceil(document.body.getBoundingClientRect().height),bibAncha:document.documentElement.scrollWidth>innerWidth+2},"*");addEventListener("load",t);new ResizeObserver(t).observe(document.body);<\/script></body></html>`;

// Miniaturas: se cargan al aparecer en pantalla
const vigia = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const f = e.target; f.srcdoc = doc(PZ[f.dataset.id]); vigia.unobserve(f);
}), { rootMargin: "300px" });
const vivo = id => `<iframe class="vivo" data-id="${esc(id)}" title="${esc(PZ[id].nombre)}" sandbox="allow-scripts allow-forms allow-modals"></iframe>`;
const mini = id => `<div class="mini"><iframe data-id="${esc(id)}" tabindex="-1" aria-hidden="true" sandbox="allow-scripts"></iframe></div>`;
addEventListener("message", e => {
  const alto = e.data?.bibAlto; if (!alto) return;
  if (actual && e.source === $("grande")?.contentWindow) { $("grande").style.height = Math.min(Math.max(alto + 2, 200), 4000) + "px"; return; }
  for (const f of document.querySelectorAll("iframe.vivo")) if (f.contentWindow === e.source) {
    f.style.height = Math.min(Math.max(alto, 60), 900) + "px"; f.classList.add("listo");
    // Si no cabe en media columna, ocupa la fila entera
    if (e.data.bibAncha) f.closest(".ver")?.classList.add("ancha");
    return;
  }
  for (const f of document.querySelectorAll(".mini iframe")) if (f.contentWindow === e.source) {
    const caja = f.parentElement.clientHeight, real = alto * .55;
    f.style.setProperty("--y", real < caja ? (caja - real) / 2 + "px" : "0px");
    f.classList.add("listo"); break;
  }
});

/* ===== Estado en la dirección: #g=grupo&pro=proyecto&p=pieza (así «atrás» funciona) ===== */
let estado = { g: "", pro: "", p: "" }, q = "";
const leer = () => { const h = new URLSearchParams(location.hash.slice(1));
  // enlaces antiguos: #id-de-pieza
  if (location.hash.length > 1 && !location.hash.includes("=")) return { g: "", pro: "", p: decodeURIComponent(location.hash.slice(1)) };
  return { g: h.get("g") || "", pro: h.get("pro") || "", p: h.get("p") || "" }; };
const enlace = s => { const h = new URLSearchParams(); for (const k of ["g", "pro", "p"]) if (s[k]) h.set(k, s[k]); const t = h.toString(); return t ? "#" + t : location.pathname; };
const ir = (cambios, reemplazar = false) => {
  const nuevo = { ...estado, ...cambios }, url = enlace(nuevo);
  reemplazar ? history.replaceState(null, "", url) : history.pushState(null, "", url);
  aplicar();
};
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-ir]"); if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); ir(JSON.parse(a.dataset.ir));
});
const ira = cambios => `href="${enlace({ ...estado, ...cambios })}" data-ir='${esc(JSON.stringify(cambios))}'`;

const delProyecto = l => estado.pro ? l.filter(p => p.proyecto === estado.pro) : l;
const delGrupo = g => delProyecto(piezas.filter(p => p.grupos.includes(g)));

/* ===== Índice lateral ===== */
function pintarIndice() {
  const total = delProyecto(piezas).length;
  $("indice").innerHTML = `
    <a class="todas ${!estado.g && !q ? "on" : ""}" ${ira({ g: "" })}>Todos los grupos <small>${total}</small></a>
    <div class="pro-sel"><label for="pro">Proyecto</label><select id="pro"><option value="">Todos los proyectos</option>${nombresPro.map(n => `<option value="${esc(n)}" ${estado.pro === n ? "selected" : ""}>${esc(n)} (${piezas.filter(p => p.proyecto === n).length})</option>`).join("")}</select></div>` +
    familias.map(f => `<div class="fam">${esc(f)}</div>` + grupos.filter(g => g.familia === f).map(g => {
      const n = delGrupo(g.id).length;
      return `<a class="${estado.g === g.id && !q ? "on" : ""} ${n ? "" : "vacio-g"}" ${ira({ g: g.id })}>${esc(g.titulo)} <small>${n}</small></a>`;
    }).join("")).join("");
  $("pro").onchange = e => ir({ pro: e.target.value });
}

/* ===== Vistas ===== */
let visibles = [];
const tarjeta = p => `<a class="pieza" ${ira({ p: p.id })}>${mini(p.id)}
  <div class="txt"><b>${esc(p.nombre)}</b><div class="meta"><span class="pro" style="--c:${color(p.proyecto)}"><i></i>${esc(p.proyecto.replace(/ \(.*\)$/, ""))}</span>${p.stack ? `<span class="stack">${esc(p.stack)}</span>` : ""}</div></div></a>`;
const chipProyecto = () => estado.pro ? `<span class="filtro-on" style="--c:${color(estado.pro)}"><i></i>${esc(estado.pro)}<button id="quitarPro" title="Quitar filtro">✕</button></span>` : "";
const sinNada = txt => `<div class="vacio"><b>No hay piezas aquí</b>${txt}${estado.pro ? `<br><button id="quitarPro2">Ver todos los proyectos</button>` : ""}</div>`;

function vistaInicio() {
  visibles = [];
  return `<div class="vista-head"><div><h2>¿Qué estás buscando?</h2><p>Elige un tipo de pieza o escribe arriba lo que necesitas.</p></div>${chipProyecto()}</div>` +
    familias.map(f => {
      const losas = grupos.filter(g => g.familia === f).map(g => {
        const l = delGrupo(g.id); if (!l.length) return "";
        const portada = l.find(p => p.id === g.portada) || l[0];
        const pros = [...new Set(l.map(p => p.proyecto))];
        return `<a class="losa" ${ira({ g: g.id })}>${mini(portada.id)}<div class="txt"><b>${esc(g.titulo)}</b><p>${esc(g.descripcion)}</p>
          <div class="pie"><span>${plural(l.length, "pieza", "piezas")}</span><span class="puntos" title="${esc(pros.join(", "))}">${pros.slice(0, 6).map(n => `<i style="--c:${color(n)}"></i>`).join("")}</span></div></div></a>`;
      }).join("");
      return losas ? `<div class="familia"><h3>${esc(f)}</h3><div class="losas">${losas}</div></div>` : "";
    }).join("") || sinNada("Este proyecto no tiene piezas.");
}
function vistaDirecta(g) {
  // Conjuntos: las versiones parecidas juntas; lo que no esté en ninguno va solo
  const enConj = new Set(g.conjuntos.flatMap(c => c.piezas));
  const conjuntos = [...g.conjuntos, ...delGrupo(g.id).filter(p => !enConj.has(p.id)).map(p => ({ titulo: p.nombre, piezas: [p.id] }))]
    .map(c => ({ ...c, l: delProyecto(c.piezas.map(i => PZ[i]).filter(Boolean)) })).filter(c => c.l.length);
  visibles = conjuntos.flatMap(c => c.l);
  const cab = `<div class="vista-head"><div><div class="miga"><a ${ira({ g: "" })}>Biblioteca</a> › ${esc(g.familia)}</div><h2>${esc(g.titulo)}</h2><p>${esc(g.descripcion)} · ${plural(conjuntos.length, "tipo", "tipos")}, ${plural(visibles.length, "versión", "versiones")}</p></div>${chipProyecto()}</div>`;
  if (!conjuntos.length) return cab + sinNada("Ningún proyecto de este filtro tiene piezas de este grupo.");
  return cab + (conjuntos.length > 1 ? `<nav class="saltos">${conjuntos.map((c, i) => `<a href="#" data-salto="c${i}">${esc(c.titulo)}${c.l.length > 1 ? `<small>${c.l.length}</small>` : ""}</a>`).join("")}</nav>` : "") +
    conjuntos.map((c, i) => `<section class="conj" id="c${i}"><div class="conj-head"><h3>${esc(c.titulo)}</h3>${c.l.length > 1 ? `<span>${c.l.length} versiones</span>` : ""}</div>
      <div class="versiones ${c.ancho || c.l.length === 1 ? "una" : ""}">${c.l.map(p => `<article class="ver"><div class="ver-vivo">${vivo(p.id)}</div>
        <div class="ver-pie"><span class="pro" style="--c:${color(p.proyecto)}"><i></i>${esc(p.proyecto.replace(/ \(.*\)$/, ""))}</span><span class="ver-nom">${esc(p.nombre)}</span><a class="ver-cod" ${ira({ p: p.id })}>Código y reglas</a></div></article>`).join("")}</div></section>`).join("");
}
document.addEventListener("click", e => { const s = e.target.closest("[data-salto]"); if (!s) return; e.preventDefault(); $(s.dataset.salto)?.scrollIntoView({ behavior: "smooth" }); });
function vistaGrupo() {
  const g = GR[estado.g];
  if (g.directo) return vistaDirecta(g);
  visibles = delGrupo(g.id);
  return `<div class="vista-head"><div><div class="miga"><a ${ira({ g: "" })}>Biblioteca</a> › ${esc(g.familia)}</div><h2>${esc(g.titulo)}</h2><p>${esc(g.descripcion)} · ${plural(visibles.length, "pieza", "piezas")}</p></div>${chipProyecto()}</div>` +
    (visibles.length ? `<div class="rejilla">${visibles.map(tarjeta).join("")}</div>` : sinNada("Ningún proyecto de este filtro tiene piezas de este grupo."));
}
function vistaBusqueda() {
  const t = norm(q);
  visibles = delProyecto(piezas).filter(p => norm([p.nombre, p.descripcion, p.cuando_usar, p.proyecto, p.stack, ...p.grupos.map(g => GR[g]?.titulo), ...p.reglas].join(" ")).includes(t));
  return `<div class="vista-head"><div><div class="miga"><a ${ira({ g: "" })}>Biblioteca</a> › Búsqueda</div><h2>«${esc(q)}»</h2><p>${plural(visibles.length, "resultado", "resultados")}</p></div>${chipProyecto()}</div>` +
    (visibles.length ? `<div class="rejilla">${visibles.map(tarjeta).join("")}</div>` : sinNada("Prueba con otra palabra: tabla, login, calendario, toast…"));
}
function pintarVista() {
  $("vista").innerHTML = q ? vistaBusqueda() : estado.g && GR[estado.g] ? vistaGrupo() : vistaInicio();
  $("vista").querySelectorAll("iframe[data-id]").forEach(f => vigia.observe(f));
  for (const id of ["quitarPro", "quitarPro2"]) if ($(id)) $(id).onclick = () => ir({ pro: "" });
}

let ultimaVista = "";
function aplicar() {
  estado = leer();
  const clave = [estado.g, estado.pro, q].join("|");
  if (clave !== ultimaVista) {
    ultimaVista = clave; pintarIndice(); pintarVista();
    if (!estado.p) scrollTo({ top: 0 });
  }
  estado.p && PZ[estado.p] ? abrir(PZ[estado.p]) : cerrarDetalle();
}
addEventListener("popstate", aplicar);

let tq;
$("q").oninput = e => { clearTimeout(tq); tq = setTimeout(() => { q = e.target.value.trim(); aplicar(); }, 120); };
addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.matches("input, textarea") && !actual) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && e.target === $("q")) { $("q").value = ""; q = ""; aplicar(); $("q").blur(); }
});

/* ===== Detalle de una pieza ===== */
let actual = null, pestana = "html";
function abrir(p) {
  if (actual?.id === p.id) return;
  actual = p;
  const lista = visibles.length ? visibles : piezas, i = lista.findIndex(x => x.id === p.id);
  $("pos").textContent = i >= 0 ? `${i + 1} de ${lista.length}` : "";
  if (!p[pestana]) pestana = "html";
  // Un iframe nuevo cada vez: cambiar el srcdoc de uno ya cargado añade un paso al historial y «atrás» dejaría de cerrar
  const f = document.createElement("iframe");
  Object.assign(f, { id: "grande", title: "Vista de la pieza", srcdoc: doc(p) });
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals");
  f.style.width = $("ancho").querySelector(".on").dataset.w;
  $("lienzo").replaceChildren(f);
  const arch = p.archivos.map(a => { const [ruta, linea] = a.split(/:(?=\d+$)/);
    return `<a href="vscode://file/Users/lolyfernandezrodriguez/Desktop/${encodeURI(ruta)}${linea ? ":" + linea : ""}" title="Abrir en VS Code">${esc(a)}</a>`; }).join("");
  const lista2 = (t, l) => l?.length ? `<div><h4>${t}</h4><ul>${l.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : "";
  $("ficha").innerHTML = `
    <div><div class="meta" style="margin-bottom:8px"><span class="pro" style="--c:${color(p.proyecto)}"><i></i>${esc(p.proyecto)}</span>${p.stack ? `<span class="stack">${esc(p.stack)}</span>` : ""}</div>
      <h3>${esc(p.nombre)}</h3></div>
    <p>${esc(p.descripcion)}</p>
    <div class="etis">${p.grupos.map(g => `<a ${ira({ g, p: "" })} title="Ver todas las piezas de este grupo">${esc(GR[g]?.titulo)}</a>`).join("")}</div>
    ${p.cuando_usar ? `<div class="usar"><h4>Cuándo usarla</h4><p>${esc(p.cuando_usar)}</p></div>` : ""}
    ${lista2("Reglas aprendidas", p.reglas)}
    ${lista2("Cómo es en otros proyectos", p.variantes)}
    ${fuentes[p.proyecto] ? `<div><h4>Tipografía del proyecto</h4><p>${esc(fuentes[p.proyecto])}</p></div>` : ""}
    ${arch ? `<div class="arch"><h4>Dónde está</h4>${arch}</div>` : ""}
    <div class="codigo">
      <div class="codigo-bar">${["html", "css", "js"].map(k => `<button data-k="${k}" ${p[k] ? "" : "disabled"}>${k.toUpperCase()}</button>`).join("")}
        <span class="sp"></span><button class="copiar" id="copiar">Copiar</button><button class="copiar" id="copiarTodo" title="Una página HTML completa con todo dentro">Copiar todo</button></div>
      <pre id="code"></pre>
    </div>`;
  pintarCodigo();
  $("ficha").scrollTop = 0;
  $("det").classList.add("on");
  document.body.style.overflow = "hidden";
}
function pintarCodigo() {
  $("code").textContent = actual[pestana];
  $("ficha").querySelectorAll(".codigo-bar [data-k]").forEach(b => b.classList.toggle("on", b.dataset.k === pestana));
}
$("ficha").addEventListener("click", async e => {
  const k = e.target.closest("[data-k]");
  if (k && !k.disabled) { pestana = k.dataset.k; pintarCodigo(); return; }
  const c = e.target.closest(".copiar"); if (!c) return;
  const p = actual;
  const txt = c.id === "copiarTodo"
    ? `<!-- ${p.nombre} · ${p.proyecto} -->\n<style>\n${p.css}\n</style>\n${p.html}${p.js ? `\n<script>\n${p.js}\n<\/script>` : ""}\n`
    : p[pestana];
  try { await navigator.clipboard.writeText(txt); toast(c.id === "copiarTodo" ? "Copiada la pieza entera" : `Copiado el ${pestana.toUpperCase()}`); }
  catch { toast("No se ha podido copiar", true); }
});
function cerrarDetalle() {
  if (!actual) return;
  $("det").classList.remove("on"); document.body.style.overflow = ""; actual = null;
  $("lienzo").replaceChildren();
}
const cerrar = () => ir({ p: "" });
const mover = d => { if (!actual) return; const l = visibles.length ? visibles : piezas; const i = l.findIndex(p => p.id === actual.id);
  const n = l[(i + d + l.length) % l.length]; if (n) ir({ p: n.id }, true); };
$("cerrar").onclick = cerrar;
$("ant").onclick = () => mover(-1);
$("sig").onclick = () => mover(1);
$("det").onclick = e => { if (e.target === $("det")) cerrar(); };
addEventListener("keydown", e => {
  if (!actual || e.target.matches("input, textarea")) return;
  if (e.key === "Escape") cerrar();
  if (e.key === "ArrowLeft") mover(-1);
  if (e.key === "ArrowRight") mover(1);
});
$("ancho").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  $("ancho").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); if ($("grande")) $("grande").style.width = b.dataset.w; };

aplicar();
</script>
</body>
</html>
